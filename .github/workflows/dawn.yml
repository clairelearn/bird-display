name: Bird display

on:
  schedule:
    # GitHub runs on UTC. Two runs per report so one always lands at
    # 7:45 / 19:45 UK time whatever the season; the check below skips the other.
    - cron: "45 6 * * *"
    - cron: "45 7 * * *"
    - cron: "45 18 * * *"
    - cron: "45 19 * * *"
  workflow_dispatch:
    inputs:
      report:
        description: "Which report to build"
        type: choice
        options: [dawn, evening]
        default: dawn

permissions:
  contents: write      # to save each report into archive/
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Which report is due?
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "report=${{ inputs.report }}" >> "$GITHUB_OUTPUT"
          else
            # Match on which schedule fired (not the clock), so a late start still counts.
            fired="${{ github.event.schedule }}"
            if [ "$(TZ=Europe/London date +%z)" = "+0100" ]; then
              dawn="45 6 * * *"; evening="45 18 * * *"      # summer time
            else
              dawn="45 7 * * *"; evening="45 19 * * *"      # winter time
            fi
            if [ "$fired" = "$dawn" ]; then
              echo "report=dawn" >> "$GITHUB_OUTPUT"
            elif [ "$fired" = "$evening" ]; then
              echo "report=evening" >> "$GITHUB_OUTPUT"
            else
              echo "Schedule '$fired' isn't the one for this time of year. Skipping."
              echo "report=none" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/checkout@v5
        if: steps.pick.outputs.report != 'none'

      - uses: actions/setup-python@v6
        if: steps.pick.outputs.report != 'none'
        with:
          python-version: "3.12"

      - name: Build the dawn chorus
        if: steps.pick.outputs.report == 'dawn'
        env:
          TZ: Europe/London
        run: python build_dawn.py

      - name: Build today's voices
        if: steps.pick.outputs.report == 'evening'
        env:
          TZ: Europe/London
        run: |
          pip install numpy soundfile
          python build_evening.py

      - name: Save to the archive and get the page ready
        if: steps.pick.outputs.report != 'none'
        env:
          TZ: Europe/London
        run: |
          mkdir -p site archive
          cp index.html "archive/$(date +%F)-${{ steps.pick.outputs.report }}.html"
          mv index.html site/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git commit -m "${{ steps.pick.outputs.report }} report for $(date +%F)" || echo "Nothing new to save"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5
        if: steps.pick.outputs.report != 'none'

      - uses: actions/upload-pages-artifact@v4
        if: steps.pick.outputs.report != 'none'
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deployment
        if: steps.pick.outputs.report != 'none'
        uses: actions/deploy-pages@v4

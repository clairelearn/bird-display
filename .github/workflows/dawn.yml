name: Bird display

on:
  # Runs are started by cron-job.org at 7:45 (dawn) and 19:45 (evening) UK time.
  workflow_dispatch:
    inputs:
      report:
        description: "Which report to build"
        type: choice
        options: [dawn, evening]
        default: dawn
      date:
        description: "Day to report on, like 2026-09-30 (leave blank for today)"
        type: string
        required: false

permissions:
  contents: write      # to save each report into archive/
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Which report is due?
        id: pick
        run: |
          echo "report=${{ inputs.report }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.pick.outputs.report != 'none'

      - uses: actions/setup-python@v6
        if: steps.pick.outputs.report != 'none'
        with:
          python-version: "3.12"

      - name: Build the dawn chorus
        if: steps.pick.outputs.report == 'dawn'
        env:
          TZ: Europe/London
        run: python build_dawn.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Build today's voices
        if: steps.pick.outputs.report == 'evening'
        env:
          TZ: Europe/London
        run: |
          pip install numpy soundfile
          python build_evening.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Save to the archive and get the page ready
        if: steps.pick.outputs.report != 'none'
        env:
          TZ: Europe/London
        run: |
          mkdir -p site archive
          day="${{ inputs.date }}"
          day="${day:-$(date +%F)}"
          cp index.html "archive/${day}-${{ steps.pick.outputs.report }}.html"
          mv index.html site/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          git commit -m "${{ steps.pick.outputs.report }} report for ${day}" || echo "Nothing new to save"
          git pull --rebase
          git push

      - uses: actions/configure-pages@v5
        if: steps.pick.outputs.report != 'none'

      - uses: actions/upload-pages-artifact@v4
        if: steps.pick.outputs.report != 'none'
        with:
          path: site

      - name: Publish to GitHub Pages
        id: deployment
        if: steps.pick.outputs.report != 'none'
        uses: actions/deploy-pages@v4

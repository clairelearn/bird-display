<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=800, height=480">
<title>Bird of the morning</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=Work+Sans:wght@400;600&display=swap">
<style>
  html, body { margin: 0; padding: 0; width: 800px; height: 480px; overflow: hidden; }
  body { font-family: "Work Sans", "Helvetica Neue", sans-serif; background: #f2efe6; color: #1b1b1b; }
  .serif { font-family: Fraunces, Georgia, serif; }
  .frame { width: 800px; height: 480px; box-sizing: border-box; background: #f2efe6; display: flex; border: 3px solid #1b1b1b; }
  .art { width: 340px; flex-shrink: 0; border-right: 3px solid #1b1b1b; display: flex; align-items: center; justify-content: center; }
  .info { flex-grow: 1; padding: 28px 32px; display: flex; flex-direction: column; gap: 14px; }
  .kicker { font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; }
  h1 { margin: 0; font-size: 50px; font-weight: 700; line-height: 1; }
  .latin { font-style: italic; font-size: 20px; }
  .rule { height: 3px; background: #1b1b1b; }
  .stats { display: flex; gap: 32px; }
  .stat { display: flex; flex-direction: column; }
  .stat .label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; }
  .stat .value { font-size: 30px; font-weight: 700; }
  .chart { display: flex; flex-direction: column; gap: 6px; }
  .bars { display: flex; align-items: flex-end; gap: 8px; height: 80px; border-bottom: 2px solid #1b1b1b; }
  .bars div { width: 36px; background: #24508f; }
  .hours { display: flex; gap: 8px; }
  .hours div { width: 36px; text-align: center; font-size: 12px; }
  .also { margin-top: auto; font-size: 14px; line-height: 1.4; }
</style>
</head>
<body>
<div class="frame">
  <div class="art">
    <svg width="320" height="320" viewBox="0 0 100 100" aria-label="Robin illustration">
      <circle cx="62" cy="38" r="26" fill="#e6b92e"/>
      <path d="M22,44 C22,34 32,28 40,30 C46,31 50,36 52,40 C64,38 80,42 90,54 L99,58 L88,60 C82,70 68,76 54,76 C42,76 32,70 28,60 C26,54 24,50 22,48 L11,47 Z" fill="#f2efe6" stroke="#1b1b1b" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M24,48 C26,58 34,68 46,70 C50,62 48,52 42,44 C36,42 28,44 24,48 Z" fill="#b5302a"/>
      <path d="M48,46 C60,44 74,48 82,56 C72,62 58,62 50,58 Z" fill="#1b1b1b"/>
      <circle cx="33" cy="38" r="1.8" fill="#1b1b1b"/>
      <line x1="48" y1="76" x2="46" y2="87" stroke="#1b1b1b" stroke-width="1.4"/>
      <line x1="56" y1="75" x2="58" y2="87" stroke="#1b1b1b" stroke-width="1.4"/>
      <line x1="4" y1="88" x2="96" y2="86" stroke="#1b1b1b" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="14" cy="82" rx="7" ry="3" fill="#3e6e3a" transform="rotate(-25 14 82)"/>
      <ellipse cx="84" cy="81" rx="7" ry="3" fill="#3e6e3a" transform="rotate(20 84 81)"/>
      <ellipse cx="72" cy="92" rx="6" ry="2.6" fill="#3e6e3a" transform="rotate(-15 72 92)"/>
    </svg>
  </div>
  <div class="info">
    <div class="kicker">Bird of the morning · Wed 16 Sep</div>
    <div>
      <h1 class="serif">European robin</h1>
      <div class="serif latin">Erithacus rubecula</div>
    </div>
    <div class="rule"></div>
    <div class="stats">
      <div class="stat"><span class="label">First heard</span><span class="value serif">05:42</span></div>
      <div class="stat"><span class="label">Detections</span><span class="value serif" style="color:#b5302a">37</span></div>
      <div class="stat"><span class="label">Wingspan</span><span class="value serif">21 cm</span></div>
    </div>
    <div class="chart">
      <div class="bars">
        <div style="height:12px"></div><div style="height:36px"></div><div style="height:78px"></div>
        <div style="height:70px"></div><div style="height:44px"></div><div style="height:36px"></div>
        <div style="height:19px"></div><div style="height:19px"></div><div style="height:19px"></div>
      </div>
      <div class="hours">
        <div>04</div><div>05</div><div>06</div><div>07</div><div>08</div><div>09</div><div>10</div><div>11</div><div>12</div>
      </div>
    </div>
    <div class="also"><strong>Also singing:</strong> wren · blackbird · great tit · goldfinch</div>
  </div>
</div>
</body>
</html>
